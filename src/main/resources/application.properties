spring.application.name=lendshelf
server.port=${PORT:5108}

spring.datasource.url=jdbc:h2:mem:lendshelf;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

spring.thymeleaf.cache=true

# Lending rules for the branch
lendshelf.loan-days=14
lendshelf.late-fee-per-day=0.15
lendshelf.max-renewals=2
lendshelf.max-open-loans=5
lendshelf.page-size=10
lendshelf.seed-demo-data=true
server.error.include-message=always
server.servlet.session.tracking-modes=cookie
