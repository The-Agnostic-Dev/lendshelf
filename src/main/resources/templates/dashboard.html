<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Librarian dashboard')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Librarian dashboard</h1>
    <p class="muted" th:text="'Today is ' + ${#temporals.format(today, 'EEEE d MMMM yyyy')}">Today</p>

    <section class="stats">
        <div><span class="stat" th:text="${titleCount}">0</span> titles</div>
        <div><span class="stat" th:text="${onLoan}">0</span> copies on loan</div>
        <div><span class="stat" th:text="${#lists.size(overdue)}">0</span> overdue</div>
        <div><span class="stat" th:text="${waiting}">0</span> reservations waiting</div>
    </section>

    <h2>Overdue items</h2>
    <table class="grid" id="overdue" th:if="${!#lists.isEmpty(overdue)}">
        <thead><tr><th>Member</th><th>Title</th><th>Barcode</th><th>Due</th><th>Days overdue</th><th>Fee so far</th></tr></thead>
        <tbody>
        <tr th:each="row : ${overdue}">
            <td><a th:href="@{/members/{id}(id=${row.loan.member.id})}" th:text="${row.loan.member.name}">Name</a></td>
            <td th:text="${row.loan.copy.book.title}">Title</td>
            <td th:text="${row.loan.copy.barcode}">300101</td>
            <td th:text="${#temporals.format(row.loan.dueOn, 'd MMM yyyy')}">1 Jan</td>
            <td class="days" th:text="${row.daysOverdue} + (${row.daysOverdue == 1} ? ' day' : ' days')">3 days</td>
            <td class="fee" th:text="'$' + ${#numbers.formatDecimal(row.fee, 1, 'COMMA', 2, 'POINT')}">$0.45</td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(overdue)}" class="muted">Nothing is overdue. Nice.</p>
</main>
</body>
</html>
