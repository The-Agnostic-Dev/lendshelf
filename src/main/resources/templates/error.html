<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1 th:text="${status == 404} ? 'Not found' : 'Something went wrong'">Something went wrong</h1>
    <p th:text="${message} ?: 'Please try again.'">Please try again.</p>
    <p><a th:href="@{/books}">Back to the catalogue</a></p>
</main>
</body>
</html>
